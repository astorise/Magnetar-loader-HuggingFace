[workspace]

[package]
name = "magnetar-loader-huggingface"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hugging Face (safetensors) production model loader for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-loader-HuggingFace"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["science"]
rust-version = "1.98"

[dependencies]
# `path` resolves inside a checkout of the parent Magnetar repository;
# `version` is what `cargo publish` records for crates.io consumers.
magnetar-runtime = { version = "0.1.0", path = "../../magnetar-runtime" }
magnetar-format-safetensors = { version = "0.1.0", path = "../../formats/safetensors" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The real `tokenizer.json`-backed implementation behind Tokenizer
# Contract (task group 9). Kept out of `magnetar-runtime` entirely --
# this external crate is the only place in the workspace that depends on
# it.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# Real chat-template rendering (`close-tachyon-scope-audit-gaps` task
# group 2): real Hugging Face `tokenizer_config.json` chat templates are
# Jinja2 templates; `minijinja` is a small, actively maintained Jinja2-
# compatible engine, the de facto standard for this exact job in the
# Rust LLM-serving ecosystem. Kept out of `magnetar-runtime` entirely --
# this is a Hugging Face convention, not a portable Magnetar concept.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

[dev-dependencies]
tempfile = "3"
